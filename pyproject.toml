[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "green-inventory-planner"
version = "0.1.0"
description = "Forecast-driven inventory and carbon-aware delivery planning"
requires-python = ">=3.11"
dependencies = [
  "numpy==2.4.6", "pandas==3.1.0", "pyomo==6.10.1", "highspy==1.15.1",
  "scikit-learn==1.9.1", "streamlit==1.66.1", "plotly==7.1.0"
]

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
